<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TFG Navigation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container">
      <!-- ========== Screen 1: Dataset Selection ========== -->
      <section id="screen-datasets" class="screen">
        <h1 class="screen-title">Select a Dataset</h1>
        <div id="datasets" class="pill-row"></div>
      </section>

      <!-- ========== Screen 2: Collection Selection ========== -->
      <section id="screen-collections" class="screen hidden">
        <h1 class="screen-title">Select a Collection</h1>
        <div id="collections" class="pill-row"></div>
      </section>

      <!-- ========== Screen 3: Navigation Mode ========== -->
      <section id="screen-navigation" class="screen hidden">
        <!-- Top bar -->
        <div class="nav-topbar">
          <button
            id="exit-nav-btn"
            class="exit-btn"
            title="Exit navigation and start over"
            aria-label="Exit navigation"
          >
            &#10005;
          </button>

          <nav class="breadcrumb" aria-label="Breadcrumb">
            <span class="breadcrumb-segment" id="bc-dataset">Dataset</span>
            <span class="breadcrumb-sep">&#8250;</span>
            <span class="breadcrumb-segment current" id="bc-collection">Collection</span>
          </nav>

          <div class="topbar-actions">
            <button
              id="change-btn"
              class="topbar-btn topbar-btn-destructive"
              title="Switch to a different collection (clears current filters and link history)"
            >
              &#8646; Change collection
            </button>
            <span class="topbar-divider" aria-hidden="true"></span>
            <button
              id="goback-btn"
              class="topbar-btn topbar-btn-primary hidden"
              title="Undo the last link navigation (one step back through the link history)"
            >
              &#8630; Go Back
            </button>
            <button
              id="restore-btn"
              class="topbar-btn topbar-btn-quiet hidden"
              title="Restore the filters and link history saved before the last Union"
            >
              &#10226; Restore
            </button>
          </div>
        </div>

        <!-- Filters -->
        <div class="panel filters-panel" data-panel-id="filters" draggable="true">
          <div class="panel-header">
            <h2 class="panel-title">Filters</h2>
            <div class="filters-actions">
              <button
                id="clear-all-filters-btn"
                class="topbar-btn topbar-btn-quiet clear-all-btn"
                title="Remove every active filter"
                disabled
              >
                Clear all
              </button>
              <button id="toggle-not-btn" class="mode-toggle include">
                Include
              </button>
            </div>
          </div>

          <div class="filter-sections">
            <!-- Metadata -->
            <div class="filter-section">
              <h3 class="filter-section-label">Metadata</h3>
              <div id="metadata-filters" class="filter-dropdowns"></div>
              <div id="metadata-active-filters" class="active-tags"></div>
            </div>
            <!-- References -->
            <div class="filter-section">
              <h3 class="filter-section-label">References</h3>
              <div id="reference-filters" class="filter-dropdowns"></div>
              <div id="reference-active-filters" class="active-tags"></div>
            </div>
          </div>
        </div>

        <!-- Links -->
        <div class="panel links-panel" data-panel-id="links" draggable="true">
          <div class="panel-header">
            <h2 class="panel-title">Links</h2>
            <button
              id="history-toggle-btn"
              class="topbar-btn history-toggle"
              title="Show the path of links you've followed"
              aria-expanded="false"
            >
              History &#9656;
            </button>
          </div>
          <div id="links" class="pill-row"></div>
          <div id="link-history" class="link-history hidden"></div>
        </div>

        <!-- Spaces: Filtered + Union grids -->
        <!-- Filtered Collection -->
        <div class="space-panel primary" data-panel-id="filtered" draggable="true">
          <div class="space-header">
            <h2 class="panel-title">Filtered Collection</h2>
            <span id="entities-count" class="count-badge"></span>
          </div>
          <div id="entities" class="entity-grid"></div>
          <div id="entities-pagination" class="pagination"></div>
        </div>

        <!-- Union Set -->
        <div class="space-panel" data-panel-id="union" draggable="true">
          <div class="space-header">
            <h2 class="panel-title">Union Set</h2>
            <div class="space-header-actions">
              <span id="union-count" class="count-badge"></span>
              <button
                id="union-btn"
                class="topbar-btn topbar-btn-primary union-add-btn"
                title="Save the current filtered results to Union, then pick another collection to explore"
              >
                &#43; Add current
              </button>
            </div>
          </div>
          <div id="union-entities" class="entity-grid"></div>
          <div id="union-pagination" class="pagination"></div>
        </div>
      </section>
    </div>

    <!-- Entity Detail Modal -->
    <div id="entity-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <button id="modal-close" class="modal-close">&times;</button>
        <h2 id="modal-entity-name" class="modal-title"></h2>
        <div id="modal-entity-contents" class="modal-contents"></div>
        <div id="modal-entity-resources" class="modal-section"></div>
        <div id="modal-entity-metadata" class="modal-section"></div>
        <div id="modal-entity-references" class="modal-section"></div>
      </div>
    </div>

    <!-- Toast notifications mount point -->
    <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

    <script type="module" src="src/main.js"></script>
  </body>
</html>
